name: gymos-tests
services:
  db:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: gymos_test
      POSTGRES_USER: gymos_test
      POSTGRES_PASSWORD: isolated-test-only
    ports: ["127.0.0.1:5433:5432"]
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gymos_test -d gymos_test"]
      interval: 2s
      timeout: 3s
      retries: 30
